<style>
  :root {
    --bg: #0a0a0a;
    --fg: #f5f4f0;
    --secondary: #8a8a86;
    --line: rgba(245, 244, 240, 0.14);
  }
  :root[data-theme="light"] {
    --bg: #f5f4f0;
    --fg: #0a0a0a;
    --secondary: #6f6f6a;
    --line: rgba(10, 10, 10, 0.14);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.35s ease, color 0.35s ease;
    overflow: hidden;
  }

  .mono {
    font-family: "IBM Plex Mono", "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.6875rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  /* ---------- Header: logo + wordmark ---------- */
  header {
    position: fixed;
    inset: 0 0 auto 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.5rem 1.75rem;
    z-index: 10;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    text-decoration: none;
    color: var(--fg);
  }

  .brand img {
    width: 2.5rem;
    height: 2.5rem;
    display: block;
  }

  .wordmark {
    font-size: 1.625rem;
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1;
  }

  .theme-toggle {
    appearance: none;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--fg);
    border-radius: 999px;
    padding: 0.45rem 0.9rem;
    min-height: 44px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    transition: border-color 0.2s ease, background-color 0.35s ease, color 0.35s ease;
  }
  .theme-toggle:hover { border-color: var(--fg); }
  .theme-toggle .dot {
    width: 0.5rem;
    height: 0.5rem;
    border-radius: 50%;
    background: var(--fg);
    transition: background-color 0.35s ease;
  }

  /* ---------- Globe stage ---------- */
  .stage {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 0;
  }

  .stage-inner {
    position: relative;
    width: var(--stage-size, 660px);
    height: var(--stage-size, 660px);
    overflow: visible;
  }

  .stage-inner > .canvas-holder {
    position: absolute;
    inset: 0;
  }

  .stage-inner canvas { display: block; width: 100%; height: 100%; }

  .sat {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
    user-select: none;
    display: flex;
    align-items: flex-start;
    gap: 6px;
    margin-left: -10px;
    margin-top: -10px;
    color: var(--fg);
    will-change: transform, opacity;
  }

  .sat svg { flex-shrink: 0; margin-top: 1px; }

  .sat .label {
    font-family: "IBM Plex Mono", "SF Mono", Menlo, Consolas, monospace;
    font-size: 8px;
    line-height: 13px;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }
  .sat .label span { display: block; color: var(--secondary); }
  .sat .label span:first-child { color: var(--fg); }
</style>
</head>
<body>
  <header>
    <a class="brand" href="#" aria-label="Chorus home">
      <img id="logo-mark" src="assets/logo-dark.png" width="165" height="165" alt="" aria-hidden="true" />
      <span class="wordmark">Chorus</span>
    </a>
    <button class="theme-toggle mono" id="theme-toggle" aria-label="Switch to light theme">
      <span class="dot" aria-hidden="true"></span>
      <span id="theme-label">Light</span>
    </button>
  </header>

  <div class="stage" aria-hidden="true">
    <div class="stage-inner" id="stage-inner">

    /* Africa */
    [[-6,35],[0,37],[10,37],[20,32],[30,31],[34,28],[43,11],[51,12],[48,5],[42,-1],
     [40,-10],[35,-20],[32,-29],[27,-34],[20,-35],[17,-29],[14,-22],[12,-15],[9,-7],
     [9,0],[6,4],[-4,5],[-8,4],[-13,8],[-17,14],[-16,20],[-13,27],[-9,31],[-6,35]],
    /* Eurasia */
    [[-10,36],[-9,44],[-1,46],[-5,48],[0,50],[4,53],[8,54],[6,58],[5,62],[12,66],
     [18,70],[28,71],[40,68],[50,69],[60,70],[75,73],[90,75],[105,77],[115,74],
     [130,72],[140,72],[150,70],[160,70],[170,67],[178,65],[170,60],[160,60],
     [150,59],[142,54],[135,44],[130,42],[126,38],[122,32],[120,25],[108,20],
     [105,10],[102,6],[98,10],[94,16],[91,22],[87,21],[80,15],[78,8],[73,18],
     [70,22],[66,25],[60,25],[56,26],[52,24],[58,22],[55,17],[45,13],[43,15],
     [39,21],[35,28],[35,33],[30,36],[26,37],[18,40],[12,42],[6,43],[-5,37],
     [-10,36]],
    /* Australia */
    [[114,-22],[122,-18],[130,-12],[136,-12],[142,-11],[146,-15],[149,-20],[153,-27],
     [150,-33],[146,-38],[140,-38],[135,-35],[129,-32],[124,-33],[115,-34],[113,-26],
     [114,-22]],
    /* New Guinea */
    [[131,-1],[141,-3],[147,-6],[150,-10],[143,-9],[135,-4],[131,-1]],
    /* Borneo */
    [[109,1],[114,5],[117,7],[118,1],[114,-3],[109,-1],[109,1]],
    /* Sumatra / Java */
    [[95,5],[100,2],[104,-3],[110,-7],[114,-8],[112,-9],[105,-7],[100,-1],[95,3],[95,5]],
    /* Madagascar */
    [[44,-12],[49,-13],[50,-16],[47,-25],[44,-25],[43,-20],[44,-12]],
    /* Japan */
    [[130,31],[132,34],[136,35],[140,36],[141,40],[142,44],[145,44],[141,42],[140,35],
     [135,33],[131,30],[130,31]],
    /* British Isles */
    [[-5,50],[-2,52],[-1,54],[-4,58],[-7,57],[-5,53],[-6,51],[-5,50]],
    /* New Zealand */
    [[172,-34],[176,-38],[178,-38],[175,-41],[170,-44],[167,-46],[170,-42],[172,-34]],
    /* Antarctica */
    [[-180,-70],[180,-70],[180,-90],[-180,-90],[-180,-70]],
    [[-64,-63],[-58,-64],[-62,-70],[-70,-70],[-64,-63]]
  ];

  function pointInPoly(lon, lat, poly) {
    var inside = false;
    for (var i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      var xi = poly[i][0], yi = poly[i][1];
      var xj = poly[j][0], yj = poly[j][1];
      if ((yi > lat) !== (yj > lat) &&
          lon < ((xj - xi) * (lat - yi)) / (yj - yi) + xi) {
        inside = !inside;
      }
    }
    return inside;
  }

  function isLand(lon, lat) {
    for (var i = 0; i < POLYGONS.length; i++) {
      if (pointInPoly(lon, lat, POLYGONS[i])) return true;
    }
    return false;
  }

  /* ================= Globe geometry ================= */
  var DEG = Math.PI / 180;

  // land dots: near-equal-area sampling of the landmask
  var landDots = [];
  (function () {
    var latStep = 3;
    for (var lat = -84; lat <= 84; lat += latStep) {
      var lonStep = latStep / Math.max(0.25, Math.cos(lat * DEG));
      for (var lon = -180; lon < 180; lon += lonStep) {
        if (!isLand(lon, lat)) continue;
        var phi = lat * DEG, lam = lon * DEG;
        landDots.push([
          Math.cos(phi) * Math.sin(lam),   // x
          Math.sin(phi),                   // y (spin axis)
          Math.cos(phi) * Math.cos(lam)    // z
        ]);
      }
    }
  })();

  // graticule polylines (earth frame)
  var graticule = [];
  (function () {
    var lat, lon, line;
    for (lon = -180; lon < 180; lon += 30) {
      line = [];
      for (lat = -90; lat <= 90; lat += 4) {
        line.push([Math.cos(lat * DEG) * Math.sin(lon * DEG),
                   Math.sin(lat * DEG),
                   Math.cos(lat * DEG) * Math.cos(lon * DEG)]);
      }
      graticule.push(line);
    }
    for (lat = -60; lat <= 60; lat += 30) {
      line = [];
      for (lon = -180; lon <= 180; lon += 4) {
        line.push([Math.cos(lat * DEG) * Math.sin(lon * DEG),
                   Math.sin(lat * DEG),
                   Math.cos(lat * DEG) * Math.cos(lon * DEG)]);
      }
      graticule.push(line);
    }
  })();

  /* ================= Satellites ================= */
  var SATS = [
    { name: "SAT-001", l2: "INC 28.5°", l3: "7.91 KM/S",
      inc: 28.5, raan: 30,  radius: 1.22, speed: 0.30, phase: 0.0 },
    { name: "SAT-047", l2: "INC 51.6°", l3: "ALT 408KM",
      inc: 51.6, raan: -50, radius: 1.35, speed: 0.26, phase: 2.1 },
    { name: "POLAR-3", l2: "SSO 97.4°", l3: "T 98.7MIN",
      inc: 97.4, raan: 100, radius: 1.50, speed: 0.21, phase: 4.2 }
  ];

  var stageInner = document.getElementById("stage-inner");

  var RETICLE =
    '<svg width="20" height="20" viewBox="0 0 32 32" style="flex-shrink:0;margin-top:1px" aria-hidden="true">' +
    '<circle cx="16" cy="16" r="10" fill="none" stroke="currentColor" stroke-opacity="0.22" stroke-width="0.8"></circle>' +
    '<line x1="3" y1="16" x2="11" y2="16" stroke="currentColor" stroke-width="1" opacity="0.82"></line>' +
    '<line x1="21" y1="16" x2="29" y2="16" stroke="currentColor" stroke-width="1" opacity="0.82"></line>' +
    '<line x1="16" y1="3" x2="16" y2="11" stroke="currentColor" stroke-width="1" opacity="0.82"></line>' +
    '<line x1="16" y1="21" x2="16" y2="29" stroke="currentColor" stroke-width="1" opacity="0.82"></line>' +
    '<circle cx="16" cy="16" r="1.5" fill="currentColor"></circle>' +
    '</svg>';

  SATS.forEach(function (sat) {
    var el = document.createElement("div");
    el.className = "sat";
    el.innerHTML =
      RETICLE +
      '<div class="label"><span>' + sat.name + "</span><span>" + sat.l2 +
      "</span><span>" + sat.l3 + "</span></div>";
    stageInner.appendChild(el);
    sat.el = el;
    sat.opacity = 1;

    // orbit plane basis (earth-tilt frame, y = polar axis)
    var i = sat.inc * DEG, o = sat.raan * DEG;
    sat.e1 = [Math.cos(o), 0, -Math.sin(o)];
    sat.e2 = [Math.sin(o) * Math.cos(i), Math.sin(i), Math.cos(o) * Math.cos(i)];
  });

  /* ================= Renderer ================= */
  var canvas = document.getElementById("globe");
  var ctx = canvas.getContext("2d");
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var size = 660;      // css px
  var TILT_X = 0.38, ROLL_Z = -0.12;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var vw = window.innerWidth, vh = window.innerHeight;
    size = Math.min(660, Math.floor(Math.min(vw, vh) * 0.92));
    root.style.setProperty("--stage-size", size + "px");
    canvas.width = size * dpr;
    canvas.height = size * dpr;
  }

  var ctX = Math.cos(TILT_X), stX = Math.sin(TILT_X);
  var cRZ = Math.cos(ROLL_Z), sRZ = Math.sin(ROLL_Z);

  // tilt (x) then roll (z); returns world [x, y, z], z toward viewer
  function orient(p) {
    var x = p[0], y = p[1], z = p[2];
    var y1 = y * ctX - z * stX;
    var z1 = y * stX + z * ctX;
    var x2 = x * cRZ - y1 * sRZ;
    var y2 = x * sRZ + y1 * cRZ;
    return [x2, y2, z1];
  }

  function drawGlobe(t) {
    var S = size * dpr;
    var cx = S / 2, cy = S / 2;
    var R = S * 0.30;

    ctx.clearRect(0, 0, S, S);

    var spin = t * 0.09;
    var cs = Math.cos(spin), ss = Math.sin(spin);

    var i, j, p, x, y, z, w;

    /* --- sphere outline --- */
    ctx.globalAlpha = 0.12;
    ctx.strokeStyle = palette.fg;
    ctx.lineWidth = dpr;
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.stroke();

    /* --- graticule (batched into front/back paths) --- */
    ctx.lineWidth = dpr * 0.7;
    var gFront = new Path2D(), gBack = new Path2D();
    for (i = 0; i < graticule.length; i++) {
      var line = graticule[i];
      var prev = null;
      for (j = 0; j < line.length; j++) {
        p = line[j];
        x = p[0] * cs + p[2] * ss;
        z = -p[0] * ss + p[2] * cs;
        w = orient([x, p[1], z]);
        var pt = [cx + w[0] * R, cy - w[1] * R, w[2]];
        if (prev) {
          var gp = (prev[2] > 0 && pt[2] > 0) ? gFront : gBack;
          gp.moveTo(prev[0], prev[1]);
          gp.lineTo(pt[0], pt[1]);
        }
        prev = pt;
      }
    }
    ctx.globalAlpha = 0.09;
    ctx.stroke(gFront);
    ctx.globalAlpha = 0.025;
    ctx.stroke(gBack);

    /* --- land dots --- */
    ctx.fillStyle = palette.fg;
    for (i = 0; i < landDots.length; i++) {
      p = landDots[i];
      x = p[0] * cs + p[2] * ss;
      z = -p[0] * ss + p[2] * cs;
      w = orient([x, p[1], z]);
      var sx = cx + w[0] * R, sy = cy - w[1] * R;
      var rad;
      if (w[2] > 0) {
        ctx.globalAlpha = 0.28 + 0.62 * w[2];
        rad = dpr * (0.8 + 0.55 * w[2]);
      } else {
        ctx.globalAlpha = 0.05;
        rad = dpr * 0.7;
      }
      ctx.fillRect(sx - rad / 2, sy - rad / 2, rad, rad);
    }

    /* --- orbits (batched) + satellites --- */
    ctx.lineWidth = dpr * 0.8;
    var rFront = new Path2D(), rBack = new Path2D();
    for (i = 0; i < SATS.length; i++) {
      var sat = SATS[i];
      var Ro = R * sat.radius;

      // ring path
      var prevPt = null;
      for (j = 0; j <= 120; j++) {
        var a = (j / 120) * Math.PI * 2;
        var ex = sat.e1, ey = sat.e2;
        var ox = Math.cos(a) * ex[0] + Math.sin(a) * ey[0];
        var oy = Math.cos(a) * ex[1] + Math.sin(a) * ey[1];
        var oz = Math.cos(a) * ex[2] + Math.sin(a) * ey[2];
        w = orient([ox, oy, oz]);
        var px2 = cx + w[0] * Ro, py2 = cy - w[1] * Ro;
        var behind = w[2] < 0 &&
          Math.hypot(px2 - cx, py2 - cy) < R;
        if (prevPt) {
          var rp = (behind || prevPt[3]) ? rBack : rFront;
          rp.moveTo(prevPt[0], prevPt[1]);
          rp.lineTo(px2, py2);
        }
        prevPt = [px2, py2, w[2], behind];
      }

      // satellite position
      var th = sat.phase + t * sat.speed;
      var sxv = Math.cos(th) * sat.e1[0] + Math.sin(th) * sat.e2[0];
      var syv = Math.cos(th) * sat.e1[1] + Math.sin(th) * sat.e2[1];
      var szv = Math.cos(th) * sat.e1[2] + Math.sin(th) * sat.e2[2];
      w = orient([sxv, syv, szv]);

      var mx = size / 2 + w[0] * (size * 0.30) * sat.radius;
      var my = size / 2 - w[1] * (size * 0.30) * sat.radius;

      var occluded = w[2] < 0 &&
        Math.hypot(mx - size / 2, my - size / 2) < size * 0.30 + 6;
      var target = occluded ? 0.12 : 1;
      if (reduceMotion) {
        sat.opacity = target;      // static frame: no later frames to converge
      } else {
        sat.opacity += (target - sat.opacity) * 0.08;
      }

      sat.el.style.transform = "translate(" + mx.toFixed(4) + "px, " + my.toFixed(4) + "px)";
      sat.el.style.opacity = sat.opacity.toFixed(4);
    }
    ctx.globalAlpha = 0.20;
    ctx.stroke(rFront);
    ctx.globalAlpha = 0.05;
    ctx.stroke(rBack);

    ctx.globalAlpha = 1;
  }

  /* ================= Loop ================= */
  var rmQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
  var reduceMotion = rmQuery.matches;
  var loopRunning = false;
  var start = null;
  var lastT = 0;
  var pollPaletteUntil = 0;

  function frame(now) {
    if (start === null) {
      start = now;
      pollPaletteUntil = now + 600;
    }
    lastT = (now - start) / 1000;
    if (now < pollPaletteUntil) refreshPalette();
    drawGlobe(lastT);
    if (!reduceMotion) {
      requestAnimationFrame(frame);
    } else {
      loopRunning = false;
    }
  }

  function startLoop() {
    if (!loopRunning) {
      loopRunning = true;
      requestAnimationFrame(frame);
    }
  }

  if (rmQuery.addEventListener) {
    rmQuery.addEventListener("change", function (e) {
      reduceMotion = e.matches;
      if (!reduceMotion) startLoop();
    });
  }

  window.addEventListener("resize", function () {
    resize();
    if (reduceMotion) {
      refreshPalette();
      drawGlobe(lastT);
    }
  });

  applyTheme(current);
  resize();
  refreshPalette();
  startLoop();
})();
</script>
</body>
