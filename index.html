<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chorus</title>
<meta name="description" content="Automated manufacturing operations for physical production." />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Chorus" />
<meta property="og:title" content="Chorus" />
<meta property="og:description" content="Automated manufacturing operations for physical production." />
<meta property="og:url" content="https://withchorus.ai/" />
<meta property="og:image" content="https://withchorus.ai/assets/og-card.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" id="icon-32" />
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png" id="icon-16" />
<link rel="icon" type="image/png" sizes="512x512" href="assets/favicon-512.png" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<link rel="stylesheet" href="assets/site.css" />
<style>
  html, body { height: 100%; }
  body { overflow: hidden; }

  /* ---------- Globe stage ---------- */
  #wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 0;
    pointer-events: none;    /* decorative layer must never swallow clicks */
  }

  #stage { position: relative; }           /* square canvas + labels live here */
  #stage canvas { display: block; }

  .sat {
    position: absolute;
    left: 0;
    top: 0;
    display: flex;
    gap: 8px;
    align-items: flex-start;
    font: 11px/1.55 "IBM Plex Mono", "SF Mono", ui-monospace, Menlo, monospace;
    letter-spacing: 0.08em;
    color: var(--sat-dim);
    white-space: nowrap;
    pointer-events: none;
    will-change: transform, opacity;
  }
  .sat svg { width: 22px; height: 22px; margin-top: 1px; opacity: 0.55; flex: none; }
  .sat .l0 { color: var(--sat-bright); }

  /* App entry point beside About. */
  .nav-cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 40px;
    padding: 0 12px;
    border: 1px solid rgba(0, 0, 0, 0.16);
    border-radius: 4px;
    background: #fff;
    color: #000;
    text-transform: none;
    white-space: nowrap;
    transition: background-color 0.2s ease;
  }
  .nav-cta:hover { background: #eaeaea; color: #000; }
  .nav-cta:focus-visible { outline: 2px solid var(--fg); outline-offset: 4px; }
  @media (max-width: 480px) {
    header { padding: 1rem 0.75rem; }
    .brand { gap: 0.5rem; }
    .brand img { width: 2rem; height: 2rem; }
    .wordmark { font-size: 1.25rem; }
    .header-right { gap: 1rem; }
    .nav-cta { padding: 0 0.6rem; letter-spacing: 0.08em; }
  }
</style>
</head>
<body>
  <header>
    <a class="brand" href="#" aria-label="Chorus home">
      <img id="logo-mark" src="assets/logo-dark.png" width="165" height="165" alt="" aria-hidden="true" />
      <span class="wordmark">Chorus</span>
    </a>
    <div class="header-right">
    <a class="nav-link" href="about.html">About</a>
    <a class="nav-link nav-cta" href="https://app.withchorus.ai">Try Now</a>
    <button class="theme-toggle" id="theme-toggle" role="switch" aria-checked="true" aria-label="Dark mode">
      <span class="dot-mark" aria-hidden="true"></span>
      <span class="knob" aria-hidden="true">
        <svg class="icon-sun" width="9" height="9" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <circle cx="12" cy="12" r="4" />
          <line x1="12"    y1="1.8"   x2="12"    y2="4.6" />
          <line x1="12"    y1="19.4"  x2="12"    y2="22.2" />
          <line x1="1.8"   y1="12"    x2="4.6"   y2="12" />
          <line x1="19.4"  y1="12"    x2="22.2"  y2="12" />
          <line x1="4.8"   y1="4.8"   x2="6.8"   y2="6.8" />
          <line x1="17.2"  y1="17.2"  x2="19.2"  y2="19.2" />
          <line x1="4.8"   y1="19.2"  x2="6.8"   y2="17.2" />
          <line x1="17.2"  y1="6.8"   x2="19.2"  y2="4.8" />
        </svg>
        <svg class="icon-moon" width="9" height="9" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
          <path d="M20.6 13.3A8.3 8.3 0 1 1 10.7 3.4a6.5 6.5 0 0 0 9.9 9.9z" />
        </svg>
      </span>
    </button>
    </div>
  </header>

  <div class="clock">
    <div class="l0">SAN FRANCISCO, CA</div>
    <div id="clock-time">--:--:--</div>
  </div>

  <div id="wrap" aria-hidden="true"><div id="stage"></div></div>

<script type="module">
import * as THREE from './assets/vendor/three.module.min.js';

const DEG = Math.PI / 180;
const stage = document.getElementById('stage');

// ---------------------------------------------------------------- renderer
// globe diameter = 71.1% of the viewport's shorter side (660px at 1342x928)
const globeSize = () => Math.round(Math.min(innerWidth, innerHeight) * 0.711);
let size = globeSize();
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(size, size);
renderer.setClearColor(0x000000, 0);
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
camera.position.z = 3.8;

const RADIUS = 1.5;
const globe = new THREE.Group();
scene.add(globe);

// scales shader point sizes relative to the original 420px@2x component
const uScale = { value: (size * renderer.getPixelRatio()) / 840 };
// dot color, switched with the page theme
const uColor = { value: new THREE.Color(0xffffff) };
const dotMaterials = [];

// ------------------------------------------------- dot shader (depth fade)
function dotMaterial(near, far, sizeNear, sizeFar) {
  const mat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    uniforms: { uScale, uColor },
    vertexShader: `
      uniform float uScale;
      varying float vFocusDist;
      void main() {
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vFocusDist = max(0.0, -mv.z - 2.3);
        float t = smoothstep(0.0, 3.0, vFocusDist);
        gl_PointSize = mix(${sizeNear.toFixed(2)}, ${sizeFar.toFixed(2)}, t) * uScale;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform vec3 uColor;
      varying float vFocusDist;
      void main() {
        float oof = smoothstep(0.0, 3.0, vFocusDist);
        float d = length(gl_PointCoord - 0.5);
        float a = 1.0 - smoothstep(mix(0.0, 0.28, oof), 0.5, d);
        float o = mix(${near.toFixed(2)}, ${far.toFixed(2)}, oof);
        if (a * o < 0.01) discard;
        gl_FragColor = vec4(uColor, a * o);
      }`,
  });
  dotMaterials.push(mat);
  return mat;
}

// ---------------------- base sphere: 4500 pts, Fibonacci / golden angle
const positions = [];
const N = 4500;
const GOLDEN = Math.PI * (3 - Math.sqrt(5));
for (let i = 0; i < N; i++) {
  const y = 1 - (i / (N - 1)) * 2;
  const rad = Math.sqrt(Math.max(0, 1 - y * y));
  const theta = GOLDEN * i;
  positions.push(RADIUS * rad * Math.cos(theta), RADIUS * y, RADIUS * rad * Math.sin(theta));
}
const baseGeometry = new THREE.BufferGeometry();
baseGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
globe.add(new THREE.Points(baseGeometry, dotMaterial(0.88, 0.18, 2.8, 1.1)));

// ------------------------------------- lat/long wireframe rings (very faint)
const ringMat = new THREE.LineBasicMaterial({
  color: 0xffffff, transparent: true, opacity: 0.07, blending: THREE.AdditiveBlending,
});
function circleGeo(r, segments = 128) {
  const pts = [];
  for (let i = 0; i <= segments; i++) {
    const a = (i / segments) * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r));
  }
  return new THREE.BufferGeometry().setFromPoints(pts);
}
for (const lat of [-60, -30, 0, 30, 60]) {
  const ring = new THREE.Line(circleGeo(RADIUS * Math.cos(lat * DEG)), ringMat);
  ring.position.y = RADIUS * Math.sin(lat * DEG);
  globe.add(ring);
}
for (let k = 0; k < 12; k++) {
  const ring = new THREE.Line(circleGeo(RADIUS), ringMat);
  ring.rotation.z = Math.PI / 2;              // stand the circle up through the poles
  ring.rotation.y = k * (Math.PI / 12);
  globe.add(ring);
}

// ----------------------------- continents: sampled outlines on the sphere
// minimal TopoJSON decoder (quantized, delta-encoded arcs)
function topoRings(topo, objName) {
  const [sx, sy] = topo.transform.scale, [tx, ty] = topo.transform.translate;
  const arcs = topo.arcs.map(arc => {
    let x = 0, y = 0;
    return arc.map(([dx, dy]) => { x += dx; y += dy; return [x * sx + tx, y * sy + ty]; });
  });
  const expand = idxs => {
    const pts = [];
    for (const i of idxs) {
      const a = i < 0 ? arcs[~i].slice().reverse() : arcs[i];
      for (let k = pts.length ? 1 : 0; k < a.length; k++) pts.push(a[k]);
    }
    return pts;
  };
  const obj = topo.objects[objName];
  const geoms = obj.geometries || [obj];
  const rings = [];                       // ALL rings incl. holes -> even-odd test handles lakes
  for (const g of geoms) {
    if (g.type === 'Polygon') for (const ringArcs of g.arcs) rings.push(expand(ringArcs));
    else if (g.type === 'MultiPolygon') for (const poly of g.arcs) for (const ringArcs of poly) rings.push(expand(ringArcs));
  }
  return rings;
}
function lonLatToVec3(lon, lat, r, out) {
  const phi = (90 - lat) * DEG, theta = (lon + 180) * DEG;
  out[0] = -r * Math.sin(phi) * Math.cos(theta);
  out[1] =  r * Math.cos(phi);
  out[2] =  r * Math.sin(phi) * Math.sin(theta);
}

fetch('assets/land-110m.json')             // merged landmasses (no country borders)
  .then(r => r.json())
  .then(topo => {
    const R = 1.54;                      // slightly above the base sphere
    const rings = topoRings(topo, 'land');
    // bounding box per ring so most point tests are a cheap reject
    const boxes = rings.map(ring => {
      let x0 = 180, x1 = -180, y0 = 90, y1 = -90;
      for (const [x, y] of ring) {
        if (x < x0) x0 = x; if (x > x1) x1 = x;
        if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
      return [x0, x1, y0, y1];
    });
    function inLand(lon, lat) {
      if (lat < -85.7) return true;      // dataset clips at ~-85.6; the cap is Antarctica
      let inside = false;
      for (let r = 0; r < rings.length; r++) {
        const b = boxes[r];
        if (lon < b[0] || lon > b[1] || lat < b[2] || lat > b[3]) continue;
        const ring = rings[r];
        for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
          const [xi, yi] = ring[i], [xj, yj] = ring[j];
          if ((yi > lat) !== (yj > lat) && lon < ((xj - xi) * (lat - yi)) / (yj - yi) + xi)
            inside = !inside;            // even-odd: holes (lakes) come out non-land
        }
      }
      return inside;
    }
    // dense uniform Fibonacci lattice, keep only the points that land on land
    const M = 36000, pts = [], v = [0, 0, 0];
    for (let i = 0; i < M; i++) {
      const y = 1 - (i / (M - 1)) * 2;
      const lat = Math.asin(y) / DEG;
      let lon = ((GOLDEN * i) % (Math.PI * 2)) / DEG;
      if (lon > 180) lon -= 360;
      if (inLand(lon, lat)) {
        lonLatToVec3(lon, lat, R, v);
        pts.push(v[0], v[1], v[2]);
      }
    }
    const g2 = new THREE.BufferGeometry();
    g2.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
    globe.add(new THREE.Points(g2, dotMaterial(0.6, 0.15, 2.5, 1.0)));
    if (reduceMotion) renderFrame(false);  // static frame drew before this layer arrived
  })
  .catch(err => console.warn('continent layer failed to load:', err));

// ----------------------------------------------- orbiting satellite labels
const satellites = [
  { r: 2.06, inc: 28.5 * DEG, node:   0 * DEG, speed: 0.0022, phase: 0,   tag: ['SAT-001', 'INC 28.5°', '7.91 KM/S'] },
  { r: 2.22, inc: 51.6 * DEG, node:  72 * DEG, speed: 0.0017, phase: 2.1, tag: ['SAT-047', 'INC 51.6°', 'ALT 408KM'] },
  { r: 1.9,  inc: 97.4 * DEG, node: 144 * DEG, speed: 0.0032, phase: 4.5, tag: ['POLAR-3', 'SSO 97.4°', 'T 98.7MIN'] },
];
const RETICLE = `<svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1">
  <circle cx="11" cy="11" r="5"/>
  <line x1="11" y1="0" x2="11" y2="4"/><line x1="11" y1="18" x2="11" y2="22"/>
  <line x1="0" y1="11" x2="4" y2="11"/><line x1="18" y1="11" x2="22" y2="11"/>
  <circle cx="11" cy="11" r="1.2" fill="currentColor" stroke="none"/></svg>`;
const labelEls = satellites.map(sat => {
  const el = document.createElement('div');
  el.className = 'sat';
  el.innerHTML = RETICLE + '<div>' +
    sat.tag.map((line, i) => `<div class="${i === 0 ? 'l0' : ''}">${line}</div>`).join('') + '</div>';
  stage.appendChild(el);
  return el;
});
const phases = satellites.map(s => s.phase);
const euler = new THREE.Euler(), p3 = new THREE.Vector3(), projected = new THREE.Vector3();
function orbitalToVec3(sat, phase, out) {
  out.set(sat.r * Math.cos(phase), 0, -sat.r * Math.sin(phase));
  euler.set(sat.inc, sat.node, 0);
  out.applyEuler(euler);
  return out;
}

// ------------------------------------------------------------------ theme
const root = document.documentElement;
const toggle = document.getElementById('theme-toggle');
const logoImg = document.getElementById('logo-mark');

function setGlobeTheme(theme) {
  const dark = theme !== 'light';
  uColor.value.set(dark ? 0xffffff : 0x0a0a0a);
  for (const mat of dotMaterials) {
    mat.blending = dark ? THREE.AdditiveBlending : THREE.NormalBlending;
    mat.needsUpdate = true;
  }
  ringMat.color.set(dark ? 0xffffff : 0x0a0a0a);
  ringMat.opacity = dark ? 0.07 : 0.12;
  ringMat.blending = dark ? THREE.AdditiveBlending : THREE.NormalBlending;
  ringMat.needsUpdate = true;
}

function applyTheme(theme) {
  if (theme === 'light') {
    root.setAttribute('data-theme', 'light');
    toggle.setAttribute('aria-checked', 'false');
    logoImg.src = 'assets/logo-light.png';
    document.getElementById('icon-32').href = 'assets/favicon-light-32.png';
    document.getElementById('icon-16').href = 'assets/favicon-light-16.png';
  } else {
    root.removeAttribute('data-theme');
    toggle.setAttribute('aria-checked', 'true');
    logoImg.src = 'assets/logo-dark.png';
    document.getElementById('icon-32').href = 'assets/favicon-32.png';
    document.getElementById('icon-16').href = 'assets/favicon-16.png';
  }
  setGlobeTheme(theme);
  if (reduceMotion) renderFrame(false);
}

let stored = null;
try { stored = localStorage.getItem('chorus-theme'); } catch (e) {}
let current = stored === 'light' ? 'light' : 'dark';

toggle.addEventListener('click', () => {
  current = current === 'light' ? 'dark' : 'light';
  try { localStorage.setItem('chorus-theme', current); } catch (e) {}
  applyTheme(current);
});

// ------------------------------------------------------------------- loop
const rmQuery = matchMedia('(prefers-reduced-motion: reduce)');
let reduceMotion = rmQuery.matches;
let loopRunning = false;

function renderFrame(advance) {
  if (advance) globe.rotation.y += 0.0018;          // slow spin
  satellites.forEach((sat, n) => {
    if (advance) phases[n] += sat.speed;
    orbitalToVec3(sat, phases[n], p3);
    projected.copy(p3).project(camera);
    const sx = ( projected.x + 1) / 2 * size;
    const sy = (-projected.y + 1) / 2 * size;
    // fade the label as its satellite swings behind the globe
    const opacity = 0.15 + 0.85 * THREE.MathUtils.smoothstep(p3.z, -sat.r * 0.5, sat.r * 0.35);
    const el = labelEls[n];
    el.style.transform = `translate(${sx + 10}px, ${sy - 10}px)`;
    el.style.opacity = String(opacity);
  });
  renderer.render(scene, camera);
}

function tick() {
  if (reduceMotion) { loopRunning = false; return; }
  requestAnimationFrame(tick);
  renderFrame(true);
}

function startLoop() {
  if (!loopRunning) {
    loopRunning = true;
    requestAnimationFrame(tick);
  }
}

if (rmQuery.addEventListener) {
  rmQuery.addEventListener('change', e => {
    reduceMotion = e.matches;
    if (!reduceMotion) startLoop();
  });
}

addEventListener('resize', () => {
  size = globeSize();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(size, size);
  uScale.value = (size * renderer.getPixelRatio()) / 840;
  if (reduceMotion) renderFrame(false);
});

// ------------------------------------------------------------ station clock
const clockEl = document.getElementById('clock-time');
const clockFmt = new Intl.DateTimeFormat('en-US', {
  timeZone: 'America/Los_Angeles',
  hour: '2-digit', minute: '2-digit', second: '2-digit',
  hour12: false,
});
function tickClock() {
  clockEl.textContent = clockFmt.format(new Date());
}
tickClock();
setInterval(tickClock, 1000);

applyTheme(current);
if (reduceMotion) renderFrame(false);
else startLoop();
</script>
</body>
</html>
